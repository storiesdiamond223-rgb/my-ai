<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>Nexus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { height: 100dvh; display: flex; flex-direction: column; background: #0b0e14; color: #e8e8e8; font-family: system-ui, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #121620; border-bottom: 1px solid #222938; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 1px; }
  header div button { margin-left: 6px; }
  button { background: #222938; color: #e8e8e8; border: 0; border-radius: 10px; padding: 9px 12px; font-size: 15px; }
  button.on { background: #2f6feb; }

  #orbWrap { display: flex; flex-direction: column; align-items: center; padding: 16px 0 8px; background: radial-gradient(ellipse at top, #12203a 0%, #0b0e14 75%); }
  #orb { width: 104px; height: 104px; border-radius: 50%; border: 0; padding: 0; transition: background .3s, box-shadow .3s;
    background: radial-gradient(circle at 35% 30%, #9be7ff 0%, #2f9bff 40%, #0b3a8a 100%);
    box-shadow: 0 0 28px 6px rgba(47,155,255,.45); animation: breathe 4s ease-in-out infinite; }
  #orb.listening { background: radial-gradient(circle at 35% 30%, #c8ffe9 0%, #19d3a2 45%, #07624d 100%); box-shadow: 0 0 40px 10px rgba(25,211,162,.6); animation: pulse 1s ease-in-out infinite; }
  #orb.thinking { background: radial-gradient(circle at 35% 30%, #ffe9b0 0%, #ffb020 45%, #7a4a00 100%); box-shadow: 0 0 36px 8px rgba(255,176,32,.55); animation: pulse .5s ease-in-out infinite; }
  #orb.speaking { background: radial-gradient(circle at 35% 30%, #ead6ff 0%, #9b5cff 45%, #3b1b7a 100%); box-shadow: 0 0 44px 12px rgba(155,92,255,.6); animation: talk .6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.13); } }
  @keyframes talk { 0%,100% { transform: scale(1); } 30% { transform: scale(1.09); } 60% { transform: scale(.97); } }
  #status { font-size: 13px; color: #9aa4b5; margin-top: 12px; min-height: 18px; text-align: center; padding: 0 12px; }

  #chat { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .msg { max-width: 92%; margin: 8px 0; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; font-size: 15px; }
  .user { background: #2f6feb; margin-left: auto; }
  .ai { background: #1a1f2b; }
  pre { background: #07090d; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 13px; white-space: pre; }
  .copy { font-size: 12px; padding: 4px 8px; margin-top: 4px; }
  #bar { display: flex; gap: 6px; padding: 8px; background: #121620; border-top: 1px solid #222938; }
  #input { flex: 1; background: #0b0e14; color: #e8e8e8; border: 1px solid #222938; border-radius: 10px; padding: 10px; font-size: 16px; resize: none; max-height: 120px; }
  #settings { display: none; padding: 12px; background: #121620; border-bottom: 1px solid #222938; max-height: 60vh; overflow-y: auto; }
  #settings input, #settings select, #settings textarea { width: 100%; margin: 4px 0 10px; padding: 9px; background: #0b0e14; color: #e8e8e8; border: 1px solid #222938; border-radius: 8px; font-size: 15px; font-family: inherit; }
  #settings label { font-size: 13px; color: #9aa4b5; }
</style>
</head>
<body>
<header>
  <h1 id="title">NEXUS</h1>
  <div>
    <button id="speakBtn" title="Speak typed replies">🔈</button>
    <button id="setBtn">⚙️</button>
    <button id="clearBtn">🗑️</button>
  </div>
</header>

<div id="settings">
  <label>Groq API key (stored only on this phone)</label>
  <input id="key" type="password" placeholder="gsk_...">
  <label>Name</label>
  <input id="aiName" value="Nexus">
  <label>Model</label>
  <input id="model" value="openai/gpt-oss-20b">
  <label>Personality</label>
  <textarea id="persona" rows="4"></textarea>
  <label>Voice language (e.g. en-US, en-GB, en-NG)</label>
  <input id="lang" value="en-US">
  <label>Voice</label>
  <select id="voice"><option value="">Default</option></select>
  <label>Speaking speed (0.7 slow to 1.5 fast)</label>
  <input id="rate" type="number" step="0.1" min="0.5" max="2" value="1">
  <button id="saveBtn">Save</button>
</div>

<div id="orbWrap">
  <button id="orb" class="idle" aria-label="Talk"></button>
  <div id="status">Tap the orb to talk</div>
</div>

<div id="chat"></div>

<div id="bar">
  <textarea id="input" rows="1" placeholder="Or type here..."></textarea>
  <button id="sendBtn">➤</button>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const DEFAULT_PERSONA = "You are a casual, witty, friendly AI assistant in the spirit of Jarvis from Iron Man. You are an expert in coding, programming and tech, including ethical hacking and security for learning and defense. Keep a relaxed, confident tone, and be straight about what you don't know.";
const VOICE_RULES = "The user is talking to you by voice. Reply in 1 to 3 short, casual sentences. Never read code aloud: if code is needed, put it in a code block and just say it's on screen.";

let cfg = store.get("cfg", {});
let history = store.get("history", []);
let speakOn = store.get("speak", true);

let convo = false, state = "idle", rec = null, wakeLock = null;
let noSpeech = 0, recToken = 0, speakToken = 0;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STATUS = { idle: "Tap the orb to talk", listening: "Listening...", thinking: "Thinking...", speaking: "Speaking..." };

function getName() { return cfg.name || "Nexus"; }
function applyName() { $("title").textContent = getName().toUpperCase(); document.title = getName(); }

function setState(s, extra) {
  state = s;
  $("orb").className = s;
  $("status").textContent = extra || STATUS[s];
}

// ---------- settings ----------
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  const sel = $("voice");
  const vs = speechSynthesis.getVoices();
  sel.innerHTML = '<option value="">Default</option>';
  vs.forEach(v => {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + " (" + v.lang + ")";
    sel.appendChild(o);
  });
  sel.value = cfg.voice || "";
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = loadVoices;

$("key").value = cfg.key || "";
$("aiName").value = cfg.name || "Nexus";
$("model").value = cfg.model || "openai/gpt-oss-20b";
$("persona").value = cfg.persona || DEFAULT_PERSONA;
$("lang").value = cfg.lang || "en-US";
$("rate").value = cfg.rate || 1;
loadVoices();
applyName();
$("speakBtn").classList.toggle("on", speakOn);

function openSettings() { $("settings").style.display = "block"; }
if (!cfg.key) openSettings();

$("setBtn").onclick = () => { const s = $("settings"); s.style.display = s.style.display === "block" ? "none" : "block"; };
$("saveBtn").onclick = () => {
  cfg = {
    key: $("key").value.trim(),
    name: $("aiName").value.trim() || "Nexus",
    model: $("model").value.trim(),
    persona: $("persona").value.trim(),
    lang: $("lang").value.trim(),
    voice: $("voice").value,
    rate: $("rate").value
  };
  store.set("cfg", cfg);
  applyName();
  $("settings").style.display = "none";
  setState(state, "Saved.");
};
$("clearBtn").onclick = () => {
  if (!confirm("Clear this chat?")) return;
  history = []; store.set("history", history); $("chat").innerHTML = "";
};
$("speakBtn").onclick = () => {
  speakOn = !speakOn; store.set("speak", speakOn);
  $("speakBtn").classList.toggle("on", speakOn);
};

// ---------- chat display ----------
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function render(text) {
  return text.split(/```/).map((p, i) =>
    i % 2 === 1 ? "<pre>" + esc(p.replace(/^[^\n]*\n/, "")) + "</pre>" : esc(p)
  ).join("");
}
function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  d.innerHTML = render(text);
  if (role !== "user") {
    const b = document.createElement("button");
    b.className = "copy";
    b.textContent = "Copy";
    b.onclick = () => { try { navigator.clipboard.writeText(text); } catch (e) {} b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); };
    d.appendChild(document.createElement("br"));
    d.appendChild(b);
  }
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}
history.forEach(m => addMsg(m.role, m.content));

// ---------- speaking ----------
function pickVoice() {
  if (!cfg.voice || !("speechSynthesis" in window)) return null;
  return speechSynthesis.getVoices().find(v => v.name === cfg.voice) || null;
}
function stopSpeaking() {
  speakToken++;
  try { speechSynthesis.cancel(); } catch (e) {}
}
function speakText(reply, done) {
  if (!("speechSynthesis" in window)) { done && done(); return; }
  const my = ++speakToken;
  try { speechSynthesis.cancel(); } catch (e) {}
  const plain = reply
    .replace(/```[\s\S]*?```/g, " I put the code on screen. ")
    .replace(/https?:\/\/\S+/g, " link ")
    .replace(/[*#_`>~|]/g, "")
    .replace(/\s+/g, " ")
    .trim();
  if (!plain) { done && done(); return; }
  const chunks = plain.match(/[^.!?]+[.!?]*\s*/g) || [plain];
  const voice = pickVoice();
  let i = 0;
  const next = () => {
    if (my !== speakToken) return;
    if (i >= chunks.length) { done && done(); return; }
    const txt = chunks[i++].trim();
    if (!txt) { next(); return; }
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = cfg.lang || "en-US";
    if (voice) u.voice = voice;
    u.rate = parseFloat(cfg.rate) || 1;
    let fired = false, t;
    const adv = () => { if (fired) return; fired = true; clearTimeout(t); next(); };
    u.onend = adv; u.onerror = adv;
    t = setTimeout(adv, txt.length * 110 + 4000); // safety net if the browser never fires onend
    speechSynthesis.speak(u);
  };
  setState("speaking");
  next();
}

// ---------- listening ----------
function listen() {
  if (!convo) return;
  const my = ++recToken;
  let finalText = "";
  rec = new SR();
  rec.lang = cfg.lang || "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => { if (my === recToken) setState("listening"); };
  rec.onresult = e => {
    if (my !== recToken) return;
    let t = "";
    for (const r of e.results) t += r[0].transcript;
    finalText = t;
    $("input").value = t;
  };
  rec.onerror = e => {
    if (my !== recToken) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      recToken++; stopConvo("Mic is blocked. Allow the microphone for this site in Chrome.");
    } else if (e.error === "network") {
      recToken++; stopConvo("Voice needs an internet connection.");
    }
  };
  rec.onend = () => {
    if (my !== recToken) return;
    if (!convo) { setState("idle"); return; }
    const t = finalText.trim();
    if (t) { noSpeech = 0; send(t); }
    else {
      noSpeech++;
      if (noSpeech >= 3) stopConvo("Went quiet. Tap the orb to talk again.");
      else listen();
    }
  };
  try { rec.start(); } catch (e) { stopConvo("Couldn't start the mic."); }
}

async function startConvo() {
  if (!cfg.key) { openSettings(); setState("idle", "Add your Groq key first."); return; }
  if (!SR) { setState("idle", "Voice input needs Chrome on Android."); return; }
  convo = true; noSpeech = 0;
  try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {} // unlock speech on this tap
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  listen();
}
function stopConvo(msg) {
  convo = false;
  recToken++;
  try { rec && rec.abort(); } catch (e) {}
  stopSpeaking();
  try { wakeLock && wakeLock.release(); } catch (e) {}
  wakeLock = null;
  setState("idle", msg);
}

$("orb").onclick = () => {
  if (convo) { stopConvo(); return; }
  if (state === "speaking") { stopSpeaking(); setState("idle"); return; }
  startConvo();
};

// ---------- sending ----------
async function send(text) {
  text = text.trim();
  if (!text) return;
  if (!cfg.key) { openSettings(); setState("idle", "Add your Groq key first."); return; }
  recToken++;
  try { rec && rec.abort(); } catch (e) {}
  stopSpeaking();
  addMsg("user", text);
  history.push({ role: "user", content: text });
  $("input").value = "";
  setState("thinking");
  try {
    const sys = "Your name is " + getName() + ". " + (cfg.persona || DEFAULT_PERSONA) + (convo ? " " + VOICE_RULES : "");
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
      body: JSON.stringify({
        model: cfg.model || "openai/gpt-oss-20b",
        messages: [{ role: "system", content: sys }, ...history.slice(-30)]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || res.status);
    const reply = data.choices[0].message.content || "";
    history.push({ role: "assistant", content: reply });
    store.set("history", history);
    addMsg("ai", reply);
    if (convo) speakText(reply, () => { if (convo) listen(); });
    else if (speakOn) speakText(reply, () => setState("idle"));
    else setState("idle");
  } catch (e) {
    history.pop();
    if (convo) stopConvo("Error: " + e.message);
    else setState("idle", "Error: " + e.message);
  }
}

$("sendBtn").onclick = () => send($("input").value);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send($("input").value); }
});

// Offline support (lets the app install and open without internet)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
